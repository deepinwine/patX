<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>登录 - 专利业务办理系统</title>
</head>
<body>
<div class="login-box">
  <h2>用户登录</h2>
  <form id="login-form">
    <label>用户名 <input name="username" type="text"></label>
    <label>密码 <input name="password" type="password"></label>
    <label>验证码 <input name="captcha" type="text"> <img src="/captcha.img" alt="验证码"></label>
    <button type="submit">登 录</button>
  </form>
  <p class="tip">请使用法人账号或自然人账号登录后查询审查信息。</p>
</div>
</body>
</html>
