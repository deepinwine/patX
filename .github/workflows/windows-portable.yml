name: Windows 便携包

# 每次推送到该分支或手动触发时，在 Windows 上构建静态链接的 patx.exe，
# 组装免安装目录（含便携 Python 侧车与规则集）并产出 zip 工件。
# 目标设备是"白名单以外不能安装软件"的 Windows：整个包解压即用，
# 不写注册表、不需要管理员权限；CNIPA 层复用系统自带 Edge/Chrome。
on:
  push:
    branches: [main, glm/cn-prosecution-reminders]
  workflow_dispatch:

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static

    steps:
      - uses: actions/checkout@v4

      - name: 安装 vcpkg（依赖由 vcpkg.json 清单在配置时自动安装）
        run: |
          git clone https://github.com/microsoft/vcpkg.git ${{ github.workspace }}\vcpkg
          & ${{ github.workspace }}\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: 配置并构建 patx（静态链接）
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: 运行离线测试
        run: ctest --test-dir build -C Release --output-on-failure

      # 主包：纯 C++/Rust，零 Python、零浏览器 —— 日常巡检（USPTO 层）开箱即用
      - name: 组装主包（无 Python）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/tools | Out-Null
          Copy-Item build/Release/patx.exe package/
          Copy-Item tools/web_dossier package/tools/web_dossier -Recurse
          Copy-Item data/deadline_rules package/data/deadline_rules -Recurse
          Copy-Item scripts/README-portable.txt package/README.txt

      - name: 打主包 zip
        shell: pwsh
        run: |
          Compress-Archive -Path package/* -DestinationPath patX-portable-windows.zip
          "主包大小：$([math]::Round((Get-Item patX-portable-windows.zip).Length / 1MB, 1)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: patX-portable-windows
          path: patX-portable-windows.zip
          retention-days: 30

      # 可选附加包：便携 Python（启用 CNIPA 浏览器接管 / EPO 时解压到主包目录）
      - name: 组装 CNIPA 附加包（便携 Python）
        shell: pwsh
        run: |
          $py = "3.11.9"
          Invoke-WebRequest `
            "https://www.python.org/ftp/python/$py/python-$py-embed-amd64.zip" `
            -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath addon/python
          python -m pip install --target addon/python/Lib/site-packages playwright
          $pth = Get-ChildItem addon/python -Filter "python*._pth" | Select-Object -First 1
          (Get-Content $pth.FullName) -replace "^#import site$", "import site" |
            Set-Content $pth.FullName
          if (Test-Path addon/python/Lib/site-packages/playwright/driver) {
            Remove-Item addon/python/Lib/site-packages/playwright/driver -Recurse -Force
          }
          Compress-Archive -Path addon/* -DestinationPath patX-cnipa-addon-python.zip
          "附加包大小：$([math]::Round((Get-Item patX-cnipa-addon-python.zip).Length / 1MB, 1)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: patX-cnipa-addon-python
          path: patX-cnipa-addon-python.zip
          retention-days: 30
